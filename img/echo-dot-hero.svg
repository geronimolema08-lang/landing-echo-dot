<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Echo Dot 5ª generación">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#e9ecf1"/>
    </linearGradient>
    <radialGradient id="body" cx="0.35" cy="0.25" r="1">
      <stop offset="0" stop-color="#454b55"/>
      <stop offset="0.6" stop-color="#262a31"/>
      <stop offset="1" stop-color="#16181d"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c424c"/>
      <stop offset="1" stop-color="#1d2027"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1479d4"/>
      <stop offset="0.5" stop-color="#00caff"/>
      <stop offset="1" stop-color="#1479d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#bg)"/>

  <!-- ondas de voz sutiles -->
  <g fill="none" stroke="#1479d4" stroke-opacity="0.16" stroke-width="2">
    <path d="M170 250 q-40 125 0 250"/>
    <path d="M120 210 q-62 165 0 330"/>
    <path d="M830 250 q40 125 0 250"/>
    <path d="M880 210 q62 165 0 330"/>
  </g>

  <!-- sombra -->
  <ellipse cx="500" cy="592" rx="215" ry="34" fill="#16181d" opacity="0.16" filter="url(#soft)"/>

  <!-- cuerpo -->
  <path d="M290 380 v95 a210 78 0 0 0 420 0 v-95 z" fill="url(#body)"/>
  <!-- textura de tela -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M300 410 h400"/><path d="M295 440 h410"/><path d="M300 470 h400"/><path d="M310 500 h380"/>
  </g>
  <!-- anillo LED -->
  <ellipse cx="500" cy="556" rx="176" ry="44" fill="none" stroke="url(#led)" stroke-width="9" filter="url(#glow)" opacity="0.95"/>
  <!-- tapa superior -->
  <ellipse cx="500" cy="380" rx="210" ry="78" fill="url(#top)"/>
  <ellipse cx="500" cy="374" rx="196" ry="68" fill="#1a1d23"/>
  <ellipse cx="500" cy="372" rx="196" ry="68" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <!-- botones superiores -->
  <g fill="#2f343c">
    <circle cx="440" cy="356" r="11"/>
    <circle cx="500" cy="346" r="11"/>
    <circle cx="560" cy="356" r="11"/>
  </g>
  <!-- brillo -->
  <ellipse cx="418" cy="336" rx="86" ry="26" fill="#ffffff" opacity="0.07"/>
</svg>
